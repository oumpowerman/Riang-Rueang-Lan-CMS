<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: High-energy entertainment indigo to vivid magenta -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Face Gradient: Warm sunny comedy yellow -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Tear Gradient: Bright cyan droplets -->
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow for high readability at small 16px tab scale -->
    <filter id="tabShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Squircle App Badge Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- 2. Comedy Laughing Face (ฮาลั่น - เรียงเรื่องลั่น) -->
  <g filter="url(#tabShadow)">
    <!-- Round Head -->
    <circle cx="32" cy="33" r="21" fill="url(#faceGrad)" />
    <!-- Cheerful Cheek Blush -->
    <ellipse cx="18" cy="37" rx="3.5" ry="2" fill="#F43F5E" opacity="0.35" />
    <ellipse cx="46" cy="37" rx="3.5" ry="2" fill="#F43F5E" opacity="0.35" />

    <!-- Laughing Eyes: Sharp happy squint curves (>< style for maximum comedy impact) -->
    <!-- Left Eye -->
    <path d="M 22 28 C 24 23, 28 23, 30 28" fill="none" stroke="#1E1B4B" stroke-width="2.8" stroke-linecap="round" />
    <!-- Right Eye -->
    <path d="M 34 28 C 36 23, 40 23, 42 28" fill="none" stroke="#1E1B4B" stroke-width="2.8" stroke-linecap="round" />

    <!-- Big Hearty Laugh Mouth (อ้าปากหัวเราะกว้าง) -->
    <path d="M 20 35 C 20 46, 44 46, 44 35 Z" fill="#881337" />
    <!-- Tongue (ลิ้นหัวเราะสุดฮา) -->
    <path d="M 26 42 C 28 39, 36 39, 38 42 C 37 45.5, 27 45.5, 26 42 Z" fill="#FB7185" />
    <!-- Upper White Teeth Bar -->
    <path d="M 22 35 C 24 37, 40 37, 42 35 Z" fill="#FFFFFF" />

    <!-- 3. Dynamic Flying Laughter Tears (หัวเราะจนน้ำตาเล็ด / ลั่น) -->
    <!-- Left Tear Drop -->
    <path d="M 14 26 C 11 28, 9 32, 12 34 C 15 35, 17 31, 15 28 Z" fill="url(#tearGrad)" />
    <!-- Right Tear Drop -->
    <path d="M 50 26 C 53 28, 55 32, 52 34 C 49 35, 47 31, 49 28 Z" fill="url(#tearGrad)" />
  </g>

  <!-- 4. Top-Right Sparkle of Fun / Comedy Flash -->
  <path d="M 50 8 Q 50 14 56 14 Q 50 14 50 20 Q 50 14 44 14 Q 50 14 50 8 Z" fill="#FEF08A" opacity="0.95" />
  <circle cx="10" cy="12" r="1.5" fill="#FFFFFF" opacity="0.8" />
</svg>
